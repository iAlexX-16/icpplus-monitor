name: ICPPLUS Monitor

on:
  schedule:
    - cron: "*/10 22,6-12 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: icpplus-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install matching ChromeDriver
        uses: nanasess/setup-chromedriver@v2

      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ICP_NIE: ${{ secrets.ICP_NIE }}
          ICP_FULL_NAME: ${{ secrets.ICP_FULL_NAME }}
          ICP_NATIONALITY: ${{ secrets.ICP_NATIONALITY }}
          GMAIL_EMAIL: ${{ secrets.GMAIL_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: python monitor.py

      - name: Commit updated status
        run: |
          git config user.name "icpplus-monitor-bot"
          git config user.email "actions@github.com"
          git add data/status.json
          git diff --quiet --cached || git commit -m "Update status [skip ci]"
          git push

      - name: Upload debug screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshot
          path: |
            debug_screenshot.png
            debug_screenshot.html
          if-no-files-found: ignore
